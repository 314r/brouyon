disallowed-methods = [
    { path = "std::fs::rename", reason = "it replaces whatever has that name by now, such as a note that Dropbox just brought. Call move_new, which refuses to" },
    { path = "gpui::App::quit", reason = "it leaves without saving the note. Dispatch the Quit action, or call MayLeave::quit, which takes what Brouyon::flush gives" },
    { path = "gpui::Window::remove_window", reason = "it closes without saving the note. Call MayLeave::close, which takes what Brouyon::flush gives, or kept::close_textless for a window that holds no note" },
]

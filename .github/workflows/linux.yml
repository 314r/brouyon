# Runs everything bin/test does, proves that each guard in guards/ still catches its mistake,
# and checks the model in verify/.
name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What GPUI builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      # The Rust that mise.toml pins.
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          restore-keys: linux-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bin/test --locked
      - run: tools/prove-guards

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fetches the Java that verify/check pins.
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: verify/check

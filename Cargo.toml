[package]
name = "brouyon"
version = "0.1.0"
edition = "2024"
description = "Quick-capture markdown notes for Omarchy"
license = "MIT"
authors = ["Pierre Svaert (314r)"]
repository = "https://github.com/314r/brouyon"

[dependencies]
# Pinned to a fork's commit until huacnlee/gpui-omarchy#24, which rounds corners
# like Hyprland's windows, is merged; then back to upstream. No release built on
# gpui-kit 0.9 has reached crates.io yet: 0.2.1 requires gpui-kit 0.7, and the two
# versions must match.
gpui-omarchy = { git = "https://github.com/314r/gpui-omarchy", rev = "efeb5bea07bee8d869e20d3411c66a9974c5d1c2" }
gpui-kit = { version = "0.9.0", default-features = false, features = ["assets"] }
pulldown-cmark = { version = "0.13", default-features = false }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
notify = "7"
async-channel = "2"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.9.0", default-features = false, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = "limited"

# Half the size of a default release build, 18 MB instead of 37, at about the same speed.
# Aborting on a panic costs little here: nothing in GPUI recovers from one, and saves are
# atomic, so a crash can only lose the last moments of typing.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# gpui-pre-macros leaves a helper ungated in release builds while its module is
# gated on debug_assertions. Profiles only apply from the top-level crate, so
# this has to be repeated from gpui-omarchy's manifest.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
